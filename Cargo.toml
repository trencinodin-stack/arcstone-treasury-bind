[package]
name = "arcstone-treasury-bind"
version = "0.1.0"
edition = "2021"
authors = ["Jesse Tuohy <jt@arcstone.org>"]
description = "Canonical reference implementation of the Arcstone Treasury Binding Protocol (ARC-SPEC-2026-BIND-01, REV-11)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trencinodin-stack/arcstone-treasury-bind"
keywords = ["treasury", "zero-heap", "no-std", "iso20022", "toctou"]
categories = ["cryptography", "no-std", "embedded"]
readme = "README.md"

[dependencies]
subtle = { version = "2.5", default-features = false }

[dev-dependencies]
ed25519-dalek = { version = "2.1", default-features = false }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
